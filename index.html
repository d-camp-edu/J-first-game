<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초성 퀴즈 챌린지</title>
    <!-- CSS & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide { animation: slideIn 0.5s ease-out forwards; }
    </style>
</head>
<body>
    <!-- 화면이 안 뜰 경우를 대비한 에러 표시용 컨테이너 -->
    <div id="error-display" style="display:none; padding: 20px; color: red; font-weight: bold; text-align: center;">
        로딩 중 오류가 발생했습니다. 개발자 도구(F12) 콘솔을 확인해주세요.
    </div>
    
    <div id="root"></div>

    <!-- React & Babel Loaders -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Main Logic -->
    <script type="text/babel" data-type="module">
        // Firebase Modular SDK
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, addDoc, collection, onSnapshot, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const { useState, useEffect, useCallback } = React;

        // 1. 제공된 Firebase 설정
        const firebaseConfig = {
            apiKey: "AIzaSyB475AzDr96EP6I7YsyZx3OjnYDMuMaq7k",
            authDomain: "diabetes-sales.firebaseapp.com",
            projectId: "diabetes-sales",
            storageBucket: "diabetes-sales.firebasestorage.app",
            messagingSenderId: "778615949732",
            appId: "1:778615949732:web:9dce345e16ae48a0cbd931"
        };

        // 2. 초기화
        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (e) {
            console.error("Firebase 초기화 에러:", e);
            document.getElementById('error-display').style.display = 'block';
        }

        const APP_ID = "hospital-quiz-production";
        const DEFAULT_BRANDING = {
            title: '초성 퀴즈 챌린지',
            welcomeMsg: '병원명을 입력하고 입장하세요',
            primaryColor: '#4f46e5',
            logoBase64: ''
        };

        function App() {
            const [user, setUser] = useState(null);
            const [isReady, setIsReady] = useState(false);
            const [view, setView] = useState('login');
            const [hospitalName, setHospitalName] = useState('');
            const [adminPw, setAdminPw] = useState('');
            const [toast, setToast] = useState({ msg: '', type: '' });
            
            const [branding, setBranding] = useState(DEFAULT_BRANDING);
            const [quizzes, setQuizzes] = useState([]);
            const [logs, setLogs] = useState([]);
            
            const [currentIndex, setCurrentIndex] = useState(0);
            const [userInput, setUserInput] = useState('');
            const [feedback, setFeedback] = useState({ text: '', type: '' });

            // 인증 처리
            useEffect(() => {
                const unsubAuth = onAuthStateChanged(auth, (u) => {
                    if (u) {
                        setUser(u);
                        setIsReady(true);
                    } else {
                        signInAnonymously(auth).catch(console.error);
                    }
                });
                return () => unsubAuth();
            }, []);

            // 데이터 실시간 바인딩
            useEffect(() => {
                if (!user) return;

                const brandingRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'settings');
                const quizCol = collection(db, 'artifacts', APP_ID, 'public', 'data', 'quizzes');
                const logCol = collection(db, 'artifacts', APP_ID, 'public', 'data', 'logs');

                const unsubBranding = onSnapshot(brandingRef, (snap) => {
                    if (snap.exists()) setBranding(prev => ({ ...prev, ...snap.data() }));
                    else setDoc(brandingRef, DEFAULT_BRANDING);
                }, (err) => console.error("Firestore 권한 오류 가능성:", err));

                const unsubQuizzes = onSnapshot(quizCol, (snap) => {
                    const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setQuizzes(data.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)));
                });

                const unsubLogs = onSnapshot(logCol, (snap) => {
                    const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setLogs(data.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0)));
                });

                return () => { unsubBranding(); unsubQuizzes(); unsubLogs(); };
            }, [user]);

            const showToast = (msg, type = 'info') => {
                setToast({ msg, type });
                setTimeout(() => setToast({ msg: '', type: '' }), 2500);
            };

            const onAnswerSubmit = async (e) => {
                e.preventDefault();
                const target = quizzes[currentIndex];
                if (!target) return;
                const isCorrect = userInput.trim() === target.answer;

                await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'logs'), {
                    hospital: hospitalName,
                    initials: target.fullText,
                    submitted: userInput.trim(),
                    isCorrect,
                    timestamp: Date.now(),
                    time: new Date().toLocaleString()
                });

                if (isCorrect) {
                    setFeedback({ text: '정답입니다! 🎉', type: 'success' });
                    setTimeout(() => {
                        setUserInput('');
                        setFeedback({ text: '', type: '' });
                        setCurrentIndex(prev => (prev + 1) % quizzes.length);
                    }, 1200);
                } else {
                    setFeedback({ text: '다시 도전해보세요! ❌', type: 'error' });
                    setTimeout(() => setFeedback({ text: '', type: '' }), 1200);
                }
            };

            const onFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 1024 * 300) return showToast("300KB 이하 이미지만 가능합니다.", "error");
                const reader = new FileReader();
                reader.onloadend = () => updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'settings'), { logoBase64: reader.result });
                reader.readAsDataURL(file);
            };

            const exportCSV = () => {
                const headers = ['병원명', '초성', '답안', '결과', '시간'];
                const rows = logs.map(l => [l.hospital, l.initials, l.submitted, l.isCorrect ? '정답' : '오답', l.time]);
                const csv = "\ufeff" + [headers, ...rows].map(r => r.join(",")).join("\n");
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `quiz_report.csv`;
                link.click();
            };

            const Icon = ({ name, size = 20, color = "currentColor", className = "" }) => {
                useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [view, branding]);
                return <i data-lucide={name} style={{ width: size, height: size, color }} className={className}></i>;
            };

            if (!isReady) return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-white">
                    <div className="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mb-4"></div>
                    <p className="text-slate-400 font-bold">네트워크 연결 중...</p>
                </div>
            );

            // 뷰 렌더링
            if (view === 'login') return (
                <div className="min-h-screen flex items-center justify-center p-6">
                    {toast.msg && <div className="fixed top-10 left-1/2 -translate-x-1/2 z-[999] px-6 py-3 rounded-full bg-slate-800 text-white font-bold animate-bounce shadow-xl">{toast.msg}</div>}
                    <div className="w-full max-w-sm bg-white rounded-[3rem] shadow-2xl p-10 flex flex-col items-center">
                        <div className="mb-10">
                            {branding.logoBase64 ? <img src={branding.logoBase64} className="h-24 w-auto rounded-2xl shadow-sm" /> : 
                            <div className="p-8 rounded-[2.5rem] text-white shadow-xl" style={{backgroundColor: branding.primaryColor}}><Icon name="building-2" size={48} /></div>}
                        </div>
                        <h1 className="text-3xl font-black text-slate-800 text-center mb-2 tracking-tighter">{branding.title}</h1>
                        <p className="text-slate-400 text-sm text-center mb-10 opacity-70">{branding.welcomeMsg}</p>
                        <form onSubmit={(e) => { e.preventDefault(); if(hospitalName.trim()) setView('game'); }} className="w-full space-y-4">
                            <input type="text" value={hospitalName} onChange={e => setHospitalName(e.target.value)} placeholder="병원명 입력" className="w-full px-6 py-5 bg-slate-50 border-2 border-transparent focus:border-indigo-500 rounded-3xl outline-none font-black text-xl text-center shadow-inner transition-all" required />
                            <button type="submit" className="w-full py-5 rounded-3xl text-white font-black text-lg shadow-xl hover:brightness-110 active:scale-95 transition-all" style={{backgroundColor: branding.primaryColor}}>게임 시작</button>
                        </form>
                        <button onClick={() => setView('admin_gate')} className="mt-14 text-slate-300 hover:text-indigo-600 text-[10px] font-black uppercase tracking-[0.2em] flex items-center gap-1"><Icon name="settings" size={14}/> Admin Mode</button>
                    </div>
                </div>
            );

            if (view === 'admin_gate') return (
                <div className="min-h-screen bg-slate-900 flex items-center justify-center p-6">
                    <div className="w-full max-w-xs bg-white rounded-[3rem] p-10 text-center shadow-2xl animate-slide">
                        <Icon name="key" size={56} className="mx-auto mb-6 text-indigo-500" />
                        <h2 className="text-2xl font-black mb-8 tracking-widest uppercase">Admin Auth</h2>
                        <input type="password" value={adminPw} onChange={e => setAdminPw(e.target.value)} placeholder="Pass (1024)" className="w-full p-5 bg-slate-50 border-none rounded-2xl text-center text-3xl font-black tracking-widest mb-6 outline-none focus:ring-2 focus:ring-indigo-500" autoFocus />
                        <div className="flex gap-3">
                            <button onClick={() => setView('login')} className="flex-1 py-4 text-slate-400 font-bold">취소</button>
                            <button onClick={() => adminPw === '1024' ? setView('admin_panel') : showToast("비번 틀림", "error")} className="flex-1 py-4 bg-slate-800 text-white rounded-2xl font-black">확인</button>
                        </div>
                    </div>
                </div>
            );

            if (view === 'admin_panel') return (
                <div className="min-h-screen bg-slate-50 p-4 pb-24 overflow-x-hidden">
                    <div className="max-w-7xl mx-auto flex flex-col gap-6">
                        <header className="bg-white p-6 sm:p-8 rounded-[2.5rem] flex flex-col md:flex-row justify-between items-center gap-4 border shadow-sm">
                            <div className="flex items-center gap-4 self-start">
                                <div className="p-3 bg-indigo-600 rounded-2xl text-white shadow-lg"><Icon name="layout-dashboard" size={28}/></div>
                                <div>
                                    <h1 className="text-2xl font-black text-slate-800 tracking-tighter uppercase leading-none">Admin Panel</h1>
                                    <p className="text-slate-400 text-[10px] font-black uppercase tracking-widest mt-1 opacity-60">Realtime Database</p>
                                </div>
                            </div>
                            <button onClick={() => setView('login')} className="w-full md:w-auto px-10 py-3 bg-slate-100 rounded-2xl font-black text-slate-500 hover:bg-slate-200 text-xs tracking-wider uppercase transition-all">Logout</button>
                        </header>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div className="bg-white p-8 rounded-[2.5rem] border shadow-sm space-y-6 overflow-hidden">
                                <h3 className="text-sm font-black flex items-center gap-2 border-b pb-4 uppercase tracking-widest text-indigo-600"><Icon name="palette" size={16}/> Branding</h3>
                                <div className="space-y-4">
                                    <input type="text" value={branding.title} onChange={e => updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'settings'), {title: e.target.value})} className="w-full p-4 bg-slate-50 rounded-2xl text-sm font-black outline-none" placeholder="타이틀" />
                                    <div className="flex items-center gap-4">
                                        <input type="color" value={branding.primaryColor} onChange={e => updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'settings'), {primaryColor: e.target.value})} className="w-14 h-14 rounded-2xl cursor-pointer border-none shadow-sm p-0 overflow-hidden" />
                                        <div className="flex-1">
                                            <input type="file" accept="image/*" onChange={onFileUpload} className="hidden" id="logo-upload" />
                                            <label htmlFor="logo-upload" className="block w-full py-4 bg-indigo-50 text-indigo-600 text-center rounded-2xl text-xs font-black cursor-pointer hover:bg-indigo-100 transition-all">Logo Upload</label>
                                        </div>
                                    </div>
                                    {branding.logoBase64 && <button onClick={() => updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'settings'), {logoBase64: ''})} className="w-full py-2 text-xs text-red-400 font-bold border rounded-xl border-red-50">로고 삭제</button>}
                                </div>
                            </div>

                            <div className="bg-white p-8 rounded-[2.5rem] border shadow-sm flex flex-col h-[700px] overflow-hidden">
                                <h3 className="text-sm font-black flex items-center gap-2 border-b pb-4 uppercase tracking-widest text-indigo-600"><Icon name="plus" size={18}/> Quiz List</h3>
                                <form onSubmit={async e => {
                                    e.preventDefault();
                                    const q = e.target.initials.value.trim();
                                    const a = e.target.answer.value.trim();
                                    if (q.length !== 4) return showToast("초성 4자만!", "error");
                                    await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'quizzes'), { fullText: q, initials: q.split(''), answer: a, createdAt: Date.now() });
                                    e.target.reset();
                                    showToast("추가됨!");
                                }} className="flex flex-col gap-3 my-6">
                                    <input name="initials" placeholder="초성 4자 (예: ㄱㄴㄷㄹ)" maxLength={4} className="w-full p-4 bg-slate-50 border rounded-2xl text-xl font-black text-center uppercase tracking-[0.3em]" required />
                                    <input name="answer" placeholder="정답" className="w-full p-4 bg-slate-50 border rounded-2xl text-base font-bold" required />
                                    <button type="submit" className="w-full py-4 bg-slate-800 text-white rounded-2xl font-black text-sm hover:bg-black transition-all">Add Quiz</button>
                                </form>
                                <div className="flex-1 overflow-y-auto space-y-3 pr-2 custom-scrollbar">
                                    {quizzes.map(q => (
                                        <div key={q.id} className="p-5 bg-slate-50 rounded-[2rem] flex justify-between items-center border border-transparent hover:border-indigo-100 transition-all">
                                            <div>
                                                <div className="text-indigo-600 font-black text-xl tracking-[0.2em]">{q.fullText}</div>
                                                <div className="text-[10px] text-slate-400 font-bold italic mt-1">{q.answer}</div>
                                            </div>
                                            <button onClick={() => deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'quizzes', q.id))} className="p-3 text-slate-200 hover:text-red-500 transition-colors"><Icon name="trash" size={18}/></button>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="bg-white p-8 rounded-[2.5rem] border shadow-sm flex flex-col h-[700px] overflow-hidden">
                                <div className="flex justify-between items-center border-b pb-4 mb-6">
                                    <h3 className="text-sm font-black uppercase tracking-widest text-indigo-600">Logs ({logs.length})</h3>
                                    <button onClick={exportCSV} className="p-2 bg-emerald-50 text-emerald-600 rounded-xl shadow-sm hover:bg-emerald-100 transition-all"><Icon name="download" size={18}/></button>
                                </div>
                                <div className="flex-1 overflow-x-auto overflow-y-auto custom-scrollbar">
                                    <table className="w-full text-left text-[11px] min-w-[320px]">
                                        <thead className="sticky top-0 bg-white text-slate-300 font-black uppercase border-b border-slate-50 z-10">
                                            <tr><th className="pb-4">Hosp</th><th className="pb-4 text-center">Answer</th><th className="pb-4 text-right">RST</th></tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-50">
                                            {logs.map(l => (
                                                <tr key={l.id} className="hover:bg-slate-50 transition-colors">
                                                    <td className="py-4 font-black text-slate-600 max-w-[100px] truncate">{l.hospital}</td>
                                                    <td className="py-4 text-center">
                                                        <div className="font-black text-slate-800">{l.submitted}</div>
                                                        <div className="text-[9px] text-slate-300 uppercase tracking-tighter">{l.initials}</div>
                                                    </td>
                                                    <td className="py-4 text-right">{l.isCorrect ? <Icon name="check-circle" size={18} className="text-emerald-500 inline" /> : <Icon name="x-circle" size={18} className="text-red-300 inline" />}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );

            const target = quizzes[currentIndex];
            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4 transition-all duration-1000 ease-in-out" style={{backgroundColor: branding.primaryColor}}>
                    {toast.msg && <div className="fixed top-10 left-1/2 -translate-x-1/2 z-[999] px-6 py-3 rounded-full bg-slate-800 text-white font-bold animate-bounce shadow-xl">{toast.msg}</div>}
                    <div className="w-full max-w-md bg-white rounded-[5rem] shadow-2xl p-10 sm:p-14 relative overflow-hidden flex flex-col min-h-[750px] border border-white/20">
                        <div className="absolute top-0 left-0 w-full h-3 bg-slate-100">
                            <div className="h-full transition-all duration-1000 ease-out shadow-sm" style={{width: `${quizzes.length > 0 ? ((currentIndex + 1) / quizzes.length) * 100 : 0}%`, backgroundColor: branding.primaryColor}} />
                        </div>

                        <div className="flex justify-between items-center mb-12">
                            <div className="px-6 py-2 bg-slate-50 border rounded-full text-[10px] font-black uppercase text-slate-500 shadow-inner flex items-center gap-2">
                                <Icon name="building-2" size={12} className="opacity-30" /> <span className="truncate max-w-[120px]">{hospitalName}</span>
                            </div>
                            <div className="font-black text-3xl flex items-baseline gap-1" style={{color: branding.primaryColor}}>
                                {quizzes.length > 0 ? currentIndex + 1 : 0} <span className="text-slate-200 text-base mx-1">/</span> <span className="text-slate-300 text-lg opacity-40">{quizzes.length}</span>
                            </div>
                        </div>

                        {quizzes.length > 0 && target ? (
                            <div className="flex-1 flex flex-col items-center justify-center animate-in fade-in zoom-in-95 duration-500">
                                <div className="mb-14 flex flex-col gap-4 w-full max-w-[140px]">
                                    {target.initials.map((char, i) => (
                                        <div key={i} className="aspect-square bg-slate-50 rounded-[2.5rem] flex items-center justify-center border-4 border-slate-100 shadow-xl shadow-indigo-100/20 transform animate-slide" style={{animationDelay: `${i * 150}ms`}}>
                                            <span className="text-6xl font-black tracking-tighter" style={{color: branding.primaryColor}}>{char}</span>
                                        </div>
                                    ))}
                                </div>
                                <div className="h-10 mb-4 flex items-center justify-center">
                                    {feedback.text && <div className="px-6 py-2 rounded-full text-white font-black text-sm shadow-lg animate-bounce" style={{backgroundColor: feedback.type === 'success' ? '#10b981' : '#ef4444'}}>{feedback.text}</div>}
                                </div>
                                <form onSubmit={onAnswerSubmit} className="w-full space-y-8">
                                    <input type="text" value={userInput} onChange={e => setUserInput(e.target.value)} placeholder="정답 입력" className="w-full text-center text-4xl font-black py-5 border-b-4 bg-transparent outline-none uppercase placeholder:text-slate-100 tracking-tight" style={{borderBottomColor: feedback.text ? (feedback.type === 'success' ? '#10b981' : '#ef4444') : '#f1f5f9'}} autoFocus autoComplete="off" />
                                    <button type="submit" className="w-full py-6 rounded-[3rem] text-white text-2xl font-black shadow-2xl active:scale-[0.97] transition-all flex items-center justify-center gap-4 group" style={{backgroundColor: branding.primaryColor}}>SUBMIT <Icon name="chevron-right" size={36}/></button>
                                </form>
                            </div>
                        ) : (
                            <div className="flex-1 flex flex-col items-center justify-center space-y-10 text-center">
                                <Icon name="trophy" size={100} className="text-slate-100 animate-pulse"/>
                                <p className="text-slate-400 font-black text-xl leading-tight px-6 break-keep italic">문제가 준비되지 않았습니다.<br/>관리자 모드에서 문제를 등록해주세요.</p>
                            </div>
                        )}
                        <button onClick={() => { setView('login'); setHospitalName(''); }} className="mt-14 text-slate-300 hover:text-slate-500 text-[11px] font-black uppercase text-center tracking-[0.4em] transition-colors transition-all">Exit Challenge</button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
