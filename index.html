<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초성 퀴즈 챌린지</title>
    <!-- 1. 스타일 및 폰트 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>

    <!-- 2. 필수 라이브러리 (리액트 & 바벨) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 3. 파이어베이스 라이브러리 (안정성 100% Compat 버전) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
</head>
<body>
    <div id="root"></div>

    <!-- 4. 메인 애플리케이션 코드 -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // [중요] 파이어베이스 설정
        const firebaseConfig = {
            apiKey: "AIzaSyB475AzDr96EP6I7YsyZx3OjnYDMuMaq7k",
            authDomain: "diabetes-sales.firebaseapp.com",
            projectId: "diabetes-sales",
            storageBucket: "diabetes-sales.firebasestorage.app",
            messagingSenderId: "778615949732",
            appId: "1:778615949732:web:9dce345e16ae48a0cbd931"
        };

        // 앱이 두 번 초기화되지 않도록 방어
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        const db = firebase.firestore();
        const auth = firebase.auth();
        const APP_ID = "hospital-quiz-master";

        const DEFAULT_BRANDING = {
            title: '초성 퀴즈 챌린지',
            welcomeMsg: '병원명을 입력하고 입장하세요',
            primaryColor: '#4f46e5',
            logoBase64: ''
        };

        // 안전한 인라인 아이콘 (에러 원인 완벽 차단)
        const SafeIcon = ({ name, size = 24, color = "currentColor", className = "" }) => {
            const icons = {
                building: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><path d="M9 22v-4h6v4"></path><path d="M8 6h.01"></path><path d="M16 6h.01"></path><path d="M12 6h.01"></path><path d="M12 10h.01"></path><path d="M12 14h.01"></path><path d="M16 10h.01"></path><path d="M16 14h.01"></path><path d="M8 10h.01"></path><path d="M8 14h.01"></path></svg>,
                settings: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>,
                key: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"></path><path d="m21 2-9.6 9.6"></path><circle cx="7.5" cy="15.5" r="5.5"></circle></svg>,
                trophy: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 1.1-.9 2-2 2H4"></path><path d="M14 14.66V17c0 1.1.9 2 2 2h8"></path><path d="M12 17v5"></path><path d="M18 4H6v7c0 3.31 2.69 6 6 6s6-2.69 6-6V4z"></path></svg>,
                chevronRight: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="9 18 15 12 9 6"></polyline></svg>
            };
            return icons[name] || <span></span>;
        };

        function App() {
            const [isReady, setIsReady] = useState(false);
            const [view, setView] = useState('login');
            const [hospitalName, setHospitalName] = useState('');
            const [adminPw, setAdminPw] = useState('');
            const [toast, setToast] = useState('');
            
            const [branding, setBranding] = useState(DEFAULT_BRANDING);
            const [quizzes, setQuizzes] = useState([]);
            const [logs, setLogs] = useState([]);
            
            const [currentIndex, setCurrentIndex] = useState(0);
            const [userInput, setUserInput] = useState('');
            const [feedback, setFeedback] = useState({ text: '', type: '' });

            // 1. 익명 로그인
            useEffect(() => {
                auth.signInAnonymously()
                    .then(() => setIsReady(true))
                    .catch(err => {
                        console.error("인증 에러:", err);
                        setIsReady(true); // 에러가 나도 화면은 띄움
                    });
            }, []);

            // 2. 실시간 데이터 동기화
            useEffect(() => {
                if (!isReady) return;

                const unsubBranding = db.doc(`artifacts/${APP_ID}/public/data/settings`).onSnapshot((snap) => {
                    if (snap.exists) setBranding(prev => ({ ...prev, ...snap.data() }));
                    else db.doc(`artifacts/${APP_ID}/public/data/settings`).set(DEFAULT_BRANDING);
                });

                const unsubQuizzes = db.collection(`artifacts/${APP_ID}/public/data/quizzes`).onSnapshot((snap) => {
                    const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setQuizzes(data.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)));
                });

                const unsubLogs = db.collection(`artifacts/${APP_ID}/public/data/logs`).onSnapshot((snap) => {
                    const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setLogs(data.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0)));
                });

                return () => { unsubBranding(); unsubQuizzes(); unsubLogs(); };
            }, [isReady]);

            const showToastMsg = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(''), 2500);
            };

            const onAnswerSubmit = async (e) => {
                e.preventDefault();
                const target = quizzes[currentIndex];
                if (!target) return;
                const isCorrect = userInput.trim() === target.answer;

                try {
                    await db.collection(`artifacts/${APP_ID}/public/data/logs`).add({
                        hospital: hospitalName,
                        initials: target.fullText,
                        submitted: userInput.trim(),
                        isCorrect,
                        timestamp: Date.now(),
                        time: new Date().toLocaleString()
                    });
                } catch(e) { console.error(e); }

                if (isCorrect) {
                    setFeedback({ text: '정답입니다! 🎉', type: 'success' });
                    setTimeout(() => {
                        setUserInput('');
                        setFeedback({ text: '', type: '' });
                        setCurrentIndex(prev => (prev + 1) % quizzes.length);
                    }, 1200);
                } else {
                    setFeedback({ text: '틀렸습니다! ❌', type: 'error' });
                    setTimeout(() => setFeedback({ text: '', type: '' }), 1200);
                }
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 1024 * 300) return showToastMsg("300KB 이하 이미지만 가능합니다.");
                
                const reader = new FileReader();
                reader.onloadend = () => {
                    db.doc(`artifacts/${APP_ID}/public/data/settings`).update({ logoBase64: reader.result });
                };
                reader.readAsDataURL(file);
            };

            const exportCSV = () => {
                const headers = ['병원명', '초성', '답안', '결과', '시간'];
                const rows = logs.map(l => [l.hospital, l.initials, l.submitted, l.isCorrect ? 'O' : 'X', l.time]);
                const csv = "\ufeff" + [headers, ...rows].map(r => r.join(",")).join("\n");
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `quiz_report.csv`;
                link.click();
            };

            if (!isReady) return (
                <div className="min-h-screen flex items-center justify-center bg-white text-xl font-bold text-indigo-600">
                    화면 로딩 중...
                </div>
            );

            // --- 뷰 렌더링 ---
            if (view === 'login') return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-slate-50">
                    {toast && <div className="fixed top-10 px-6 py-3 rounded-full bg-slate-800 text-white font-bold animate-bounce shadow-xl">{toast}</div>}
                    <div className="w-full max-w-sm bg-white rounded-[3rem] shadow-xl p-10 flex flex-col items-center">
                        <div className="mb-8">
                            {branding.logoBase64 ? <img src={branding.logoBase64} className="h-24 w-auto rounded-2xl shadow-sm" /> : 
                            <div className="p-8 rounded-[2rem] text-white shadow-xl" style={{backgroundColor: branding.primaryColor}}>
                                <SafeIcon name="building" size={48} />
                            </div>}
                        </div>
                        <h1 className="text-2xl font-black text-slate-800 text-center mb-2">{branding.title}</h1>
                        <p className="text-slate-400 text-sm text-center mb-10">{branding.welcomeMsg}</p>
                        <form onSubmit={(e) => { e.preventDefault(); if(hospitalName.trim()) setView('game'); }} className="w-full space-y-4">
                            <input type="text" value={hospitalName} onChange={e => setHospitalName(e.target.value)} placeholder="병원명 입력" className="w-full px-6 py-4 bg-slate-50 border-2 border-transparent focus:border-indigo-500 rounded-3xl outline-none font-bold text-center" required />
                            <button type="submit" className="w-full py-4 rounded-3xl text-white font-black text-lg shadow-lg active:scale-95 transition-transform" style={{backgroundColor: branding.primaryColor}}>게임 시작</button>
                        </form>
                        <button onClick={() => setView('admin_gate')} className="mt-12 text-slate-300 hover:text-indigo-600 text-xs font-bold flex items-center gap-1">
                            <SafeIcon name="settings" size={14}/> 관리자 모드
                        </button>
                    </div>
                </div>
            );

            if (view === 'admin_gate') return (
                <div className="min-h-screen bg-slate-900 flex items-center justify-center p-6">
                    {toast && <div className="fixed top-10 px-6 py-3 rounded-full bg-red-500 text-white font-bold animate-bounce">{toast}</div>}
                    <div className="w-full max-w-xs bg-white rounded-[2rem] p-8 text-center">
                        <SafeIcon name="key" size={48} color="#4f46e5" className="mx-auto mb-4" />
                        <h2 className="text-xl font-black mb-6">ADMIN AUTH</h2>
                        <input type="password" value={adminPw} onChange={e => setAdminPw(e.target.value)} placeholder="비밀번호 (1024)" className="w-full p-4 bg-slate-100 rounded-xl text-center font-bold tracking-widest mb-6 outline-none focus:ring-2 focus:ring-indigo-500" autoFocus />
                        <div className="flex gap-2">
                            <button onClick={() => setView('login')} className="flex-1 py-3 text-slate-400 font-bold">취소</button>
                            <button onClick={() => adminPw === '1024' ? setView('admin_panel') : showToastMsg("비밀번호가 틀렸습니다.")} className="flex-1 py-3 bg-slate-800 text-white rounded-xl font-bold">확인</button>
                        </div>
                    </div>
                </div>
            );

            if (view === 'admin_panel') return (
                <div className="min-h-screen bg-slate-50 p-4 pb-20">
                    <div className="max-w-6xl mx-auto space-y-6">
                        <header className="bg-white p-6 rounded-3xl shadow-sm flex justify-between items-center border">
                            <h1 className="text-xl font-black text-slate-800 uppercase">Admin Panel</h1>
                            <button onClick={() => setView('login')} className="px-6 py-2 bg-slate-100 rounded-xl font-bold text-slate-500 text-xs">나가기</button>
                        </header>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            {/* 설정 */}
                            <div className="bg-white p-6 rounded-3xl border shadow-sm space-y-4">
                                <h3 className="font-black text-indigo-600 border-b pb-2">브랜딩 설정</h3>
                                <input type="text" value={branding.title} onChange={e => db.doc(`artifacts/${APP_ID}/public/data/settings`).update({title: e.target.value})} className="w-full p-3 bg-slate-50 rounded-xl text-sm font-bold border-none" placeholder="타이틀" />
                                <input type="text" value={branding.welcomeMsg} onChange={e => db.doc(`artifacts/${APP_ID}/public/data/settings`).update({welcomeMsg: e.target.value})} className="w-full p-3 bg-slate-50 rounded-xl text-xs font-bold border-none" placeholder="환영 메시지" />
                                <div className="flex items-center gap-3">
                                    <input type="color" value={branding.primaryColor} onChange={e => db.doc(`artifacts/${APP_ID}/public/data/settings`).update({primaryColor: e.target.value})} className="w-12 h-12 rounded-xl cursor-pointer p-0 border-none" />
                                    <div className="flex-1">
                                        <input type="file" accept="image/*" onChange={handleFileUpload} className="hidden" id="logo-upload" />
                                        <label htmlFor="logo-upload" className="block w-full py-3 bg-indigo-50 text-indigo-600 text-center rounded-xl text-xs font-black cursor-pointer">이미지 업로드</label>
                                    </div>
                                </div>
                                {branding.logoBase64 && <button onClick={() => db.doc(`artifacts/${APP_ID}/public/data/settings`).update({logoBase64: ''})} className="w-full py-2 text-xs text-red-500 font-bold border rounded-xl border-red-50">로고 지우기</button>}
                            </div>

                            {/* 퀴즈 */}
                            <div className="bg-white p-6 rounded-3xl border shadow-sm flex flex-col h-[600px]">
                                <h3 className="font-black text-indigo-600 border-b pb-2 mb-4">문제 리스트</h3>
                                <form onSubmit={async e => {
                                    e.preventDefault();
                                    const q = e.target.initials.value.trim();
                                    const a = e.target.answer.value.trim();
                                    if (q.length !== 4) return alert("초성 4자만 입력!");
                                    await db.collection(`artifacts/${APP_ID}/public/data/quizzes`).add({ fullText: q, initials: q.split(''), answer: a, createdAt: Date.now() });
                                    e.target.reset();
                                }} className="flex flex-col gap-2 mb-4">
                                    <input name="initials" placeholder="초성 4자 (예: ㄱㄴㄷㄹ)" maxLength={4} className="w-full p-3 bg-slate-50 rounded-xl font-black text-center uppercase tracking-[0.3em]" required />
                                    <input name="answer" placeholder="정답" className="w-full p-3 bg-slate-50 rounded-xl font-bold" required />
                                    <button type="submit" className="w-full py-3 bg-slate-800 text-white rounded-xl font-black text-sm">문제 추가</button>
                                </form>
                                <div className="flex-1 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
                                    {quizzes.map(q => (
                                        <div key={q.id} className="p-4 bg-slate-50 rounded-2xl flex justify-between items-center">
                                            <div>
                                                <div className="text-indigo-600 font-black text-lg tracking-widest">{q.fullText}</div>
                                                <div className="text-xs text-slate-400 font-bold">{q.answer}</div>
                                            </div>
                                            <button onClick={() => db.doc(`artifacts/${APP_ID}/public/data/quizzes/${q.id}`).delete()} className="text-red-400 font-bold p-2">X</button>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* 로그 */}
                            <div className="bg-white p-6 rounded-3xl border shadow-sm flex flex-col h-[600px]">
                                <div className="flex justify-between items-center border-b pb-2 mb-4">
                                    <h3 className="font-black text-indigo-600">참여 기록 ({logs.length})</h3>
                                    <button onClick={exportCSV} className="px-3 py-1.5 bg-emerald-50 text-emerald-600 rounded-lg text-xs font-bold">엑셀 출력</button>
                                </div>
                                <div className="flex-1 overflow-x-auto custom-scrollbar">
                                    <table className="w-full text-xs text-left min-w-[280px]">
                                        <thead className="bg-slate-50 text-slate-400"><tr><th className="p-2">병원명</th><th className="p-2 text-center">답안</th><th className="p-2 text-right">결과</th></tr></thead>
                                        <tbody className="divide-y">
                                            {logs.map(l => (
                                                <tr key={l.id}>
                                                    <td className="p-2 font-bold max-w-[80px] truncate">{l.hospital}</td>
                                                    <td className="p-2 text-center font-black">{l.submitted}</td>
                                                    <td className="p-2 text-right font-bold" style={{color: l.isCorrect ? '#10b981' : '#ef4444'}}>{l.isCorrect ? '정답' : '오답'}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );

            // 게임 화면
            const target = quizzes[currentIndex];
            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4" style={{backgroundColor: branding.primaryColor}}>
                    <div className="w-full max-w-md bg-white rounded-[4rem] shadow-2xl p-10 relative flex flex-col min-h-[650px]">
                        
                        <div className="flex justify-between items-center mb-10">
                            <div className="px-4 py-1 bg-slate-50 rounded-full text-[10px] font-black text-slate-500 truncate max-w-[150px] border">
                                {hospitalName}
                            </div>
                            <div className="font-black text-xl" style={{color: branding.primaryColor}}>
                                {quizzes.length > 0 ? currentIndex + 1 : 0} <span className="text-slate-300 text-sm">/ {quizzes.length}</span>
                            </div>
                        </div>

                        {quizzes.length > 0 && target ? (
                            <div className="flex-1 flex flex-col items-center justify-center">
                                {/* 초성 세로 배치 */}
                                <div className="mb-10 flex flex-col gap-3 w-full max-w-[120px]">
                                    {target.initials.map((char, i) => (
                                        <div key={i} className="aspect-square bg-slate-50 rounded-[2rem] flex items-center justify-center border-2 border-slate-100 shadow-md">
                                            <span className="text-6xl font-black" style={{color: branding.primaryColor}}>{char}</span>
                                        </div>
                                    ))}
                                </div>

                                <div className="h-10 mb-2">
                                    {feedback.text && <div className="px-6 py-2 rounded-full text-white font-bold text-sm shadow-lg animate-bounce" style={{backgroundColor: feedback.type === 'success' ? '#10b981' : '#ef4444'}}>{feedback.text}</div>}
                                </div>

                                <form onSubmit={onAnswerSubmit} className="w-full space-y-6">
                                    <input type="text" value={userInput} onChange={e => setUserInput(e.target.value)} placeholder="정답 입력" className="w-full text-center text-3xl font-black py-4 border-b-4 bg-transparent outline-none uppercase" autoFocus autoComplete="off" />
                                    <button type="submit" className="w-full py-5 rounded-[2.5rem] text-white text-xl font-black shadow-xl active:scale-95 transition-transform flex items-center justify-center gap-2" style={{backgroundColor: branding.primaryColor}}>
                                        제출하기 <SafeIcon name="chevronRight" size={24} color="white" />
                                    </button>
                                </form>
                            </div>
                        ) : (
                            <div className="flex-1 flex flex-col items-center justify-center text-center">
                                <SafeIcon name="trophy" size={80} color="#cbd5e1" className="mb-4" />
                                <p className="text-slate-400 font-bold">문제가 없습니다.<br/>관리자 모드에서 문제를 등록하세요.</p>
                            </div>
                        )}
                        <button onClick={() => { setView('login'); setHospitalName(''); }} className="mt-10 text-slate-300 text-[10px] font-black uppercase tracking-[0.4em]">Exit Game</button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
